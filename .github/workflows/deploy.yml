name: Deploy NestJS Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/ec2-user/First-NestJS-App

            echo "Pulling latest code..."
            git pull origin main

            echo "Building NestJS image..."
            docker compose build nestjs

            echo "Starting containers..."
            docker compose up -d --force-recreate

            echo "Waiting for services..."
            sleep 10

            echo "Running MySQL migrations..."
            docker compose exec -T nestjs npm run migration:mysql:run

            echo "Running PostgreSQL migrations..."
            docker compose exec -T nestjs npm run migration:postgres:run

            echo "Docker status:"
            docker compose ps

            echo "NestJS logs:"
            docker compose logs --tail=50 nestjs

            echo "Disk usage:"
            df -h

            echo "Deployment completed successfully!"